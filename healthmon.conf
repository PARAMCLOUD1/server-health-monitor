MEM_WARN=75;  MEM_CRIT=90
DISK_WARN=80; DISK_CRIT=90
LOAD_WARN=1.0; LOAD_CRIT=2.0
SERVICES="ssh cron"          # add: nginx apache2 mysql docker ...
